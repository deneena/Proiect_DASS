{% extends "base.html" %}
{% block content %}
<h2>Request password reset</h2>

<div class="form">
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email</label><br/>
    <input name="email" /><br/><br/>

    <button type="submit">Send token</button>
</form>
</div>

{% endblock %}
